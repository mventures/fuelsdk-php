name: SOAP compatibility

on: [push, pull_request]

permissions:
  contents: read

jobs:
  soap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, soap
          coverage: none
      - run: php tests/soap-compatibility.php
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit --bootstrap tests/UnitBootstrap.php tests/CacheServiceTest.php
